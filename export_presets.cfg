[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/holodeck/*.json, assets/fleet_tokens/*.json"
exclude_filter="docs/*, assets/pilot/*, assets/ships/kaijurai/*, assets/ships/fleet/*, assets/ships/fighters/*, assets/ships/cargo/*, assets/crowd3d/*, assets/crowd3d_orion/*, assets/bases3d/*, assets/hangars/*, build/*, tools/*, art/*, addons/*, assets/mechs/*, assets/mech_frames/*, assets/terrain/*, assets/ships/player/lancer*, assets/ships/player/ranger*, assets/ships/player/hauler*, assets/ships/player/bulk*, assets/enemy_pilots/*, assets/cockpit/*, assets/sky/*, assets/skies/*, assets/structures/*, assets/stations3d/*, assets/buildings3d/*, assets/wing_guns/*, assets/worlds/*, assets/rooms/*, assets/rooms_hostile/*, assets/characters/*, assets/assistant/*, assets/crew/*, assets/npc/*, assets/rooms_aurelion/*, assets/intro/*, assets/tutor/*, assets/music/*, assets/voices/v_*, assets/holodeck/HL_ElyzaCruiser*, assets/holodeck/HL_ElyzaDestroyer*, assets/holodeck/HL_ElyzaResupply*, assets/holodeck/HL_UnityCruiser*, assets/holodeck/HL_UnityDestroyer*, assets/holodeck/HL_UnityResupply*, assets/holodeck/HL_UnityTroopTransport*, assets/holodeck/HL_UnityFrigate*, assets/holodeck/HL_UnityEscort*, assets/holodeck/HL_UnityScout*, assets/holodeck/HL_UnityBomber*"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/custom_html_shell="res://web_shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
