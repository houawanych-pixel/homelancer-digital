[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, build/*, tools/*, art/*, addons/*, assets/mechs/*, assets/terrain/*, assets/ships/player/lancer*, assets/enemy_pilots/*, assets/city/*, assets/cockpit/*, assets/sky/*, assets/structures/*, assets/rooms/*, assets/intro/*, assets/music/*"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/custom_html_shell="res://web_shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
