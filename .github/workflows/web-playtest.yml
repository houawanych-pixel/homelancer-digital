name: Homelancer web playtest
on:
  push:
    branches: [homelancer-v1.2, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.3
        run: |
          curl -fL --retry 5 --retry-delay 5 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL --retry 5 --retry-delay 5 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -j /tmp/templates.tpz templates/web_nothreads_release.zip -d ~/.local/share/godot/export_templates/4.3.stable
      - name: Import, run the full route test, export
        run: |
          G=/tmp/godot/Godot_v4.3-stable_linux.x86_64
          $G --headless --path . --editor --import --quit
          $G --headless --path . -- --autotest --quit-after-test | tee route.log
          grep "RESULT" route.log | sed 's/^/::notice::/' || true
          grep "^\[route\]" route.log | grep -v "^\[route\] {" | grep ": FAIL" | cut -c1-900 | sed 's/^/::error::/' || true
          # owner (Nov 2 2026): deploy even when a few checks fail (they show as errors above); stop only if the test
          # crashed or most of it failed (fewer than 95% of the checks passing)
          R=$(grep -oE "RESULT [0-9]+/[0-9]+ PASS" route.log | tail -1); echo "$R"
          P=$(echo "$R" | grep -oE "[0-9]+/" | tr -d /); T=$(echo "$R" | grep -oE "/[0-9]+" | tr -d /)
          [ -n "$P" ] && [ $((P * 100)) -ge $((T * 95)) ]
          if [ "$P" != "$T" ]; then echo "::warning::$R - some route checks failed, deployed anyway"; fi
          mkdir -p build/web
          $G --headless --path . --export-release Web
          cp -r site/factions.html site/factions build/web/   # the factions page and its banners, next to the game
          printf 'Homelancer Digital v1.2\nCommit: %s\nGodot 4.3\n' "$GITHUB_SHA" > build/web/version.txt
          grep "\[route\]" route.log | grep -v "step:" >> build/web/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
