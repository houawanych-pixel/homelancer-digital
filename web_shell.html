<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Homelancer Digital v1.2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#040b15;color:#dff6ff;font:16px system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:grid;place-items:center}
#canvas{position:fixed;inset:0;width:100vw;height:100vh;outline:none;touch-action:none;display:block}
#load,#rotate{position:fixed;inset:0;background:#071426;display:grid;place-content:center;text-align:center;padding:24px}
#load{z-index:5}
h1{letter-spacing:.2em;margin:0 0 6px;font-size:clamp(24px,6vw,40px)}
p{color:#9bbfd0;margin:6px 0}
#bar{width:min(420px,72vw);height:10px;margin:18px auto 8px;border:1px solid #2f7ea3;border-radius:6px;overflow:hidden;background:#0b2238}
#fill{height:100%;width:0;background:linear-gradient(90deg,#2fb6ff,#67dcff);transition:width .25s}
/* transform-only animation runs on the compositor, so it keeps moving while the engine blocks the main thread */
#bar.busy #fill{width:35%!important;transition:none;animation:busy 1.1s ease-in-out infinite alternate;will-change:transform}
@keyframes busy{from{transform:translateX(0)}to{transform:translateX(186%)}}
#phase{color:#dff6ff;font-weight:600}
#hint{min-height:1.4em;font-size:14px}
#error{color:#ffaf97;max-width:36em}
#error button{margin-top:14px;border:1px solid #67dcff;background:#174967;color:#fff;border-radius:10px;padding:12px 18px;font-size:17px}
#rotate{display:none;z-index:10}
@media (orientation:portrait){#rotate{display:grid}}
#timing{position:fixed;left:50%;bottom:10px;translate:-50% 0;z-index:6;background:#071426e6;border:1px solid #2f7ea3;border-radius:8px;padding:6px 12px;font-size:13px;color:#9bbfd0;display:none;white-space:nowrap}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Homelancer Digital"></canvas>
<div id="load" role="status" aria-live="polite">
  <h1>HOMELANCER</h1>
  <p>Digital · v1.2 · Solara — Vega</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="phase">Preparing flight deck…</p>
  <p id="hint"></p>
  <p id="error"></p>
</div>
<div id="rotate"><h1>TURN YOUR PHONE</h1><p>Use landscape for both sticks and the flight controls.</p><p id="rotate-phase"></p></div>
<div id="timing"></div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
(function () {
  // Loading screen with real phases and timings, so a slow start on a phone shows WHERE the time goes:
  // 1 download (engine + game data), 2 engine start (WebAssembly ready -> renderer up), 3 cockpit build (scene + first frames).
  const $ = (id) => document.getElementById(id);
  const t0 = performance.now();
  const T = { download: null, engine: null, ready: null };
  const sec = (ms) => (ms / 1000).toFixed(1);
  let phase = 'download', pct = 0;
  const totalBytes = Object.values(GODOT_CONFIG.fileSizes || {}).reduce((a, b) => a + b, 0);

  function show(text) { $('phase').textContent = text; $('rotate-phase').textContent = text; }
  function tick() {
    if (phase === 'done' || phase === 'error') return;
    const s = sec(performance.now() - t0);
    if (phase === 'download') show(`Downloading ${pct}% · ${s} s`);
    if (phase === 'engine') show('Starting engine…');
    if (phase === 'cockpit') show('Building star system…');
    const el = performance.now() - t0;
    $('hint').textContent = el > 45000 ? 'Still working. A slow connection or an older phone can take a minute the first time; the next visit is faster.' :
      el > 20000 && phase === 'download' ? 'Slow connection. Wi-Fi will be quicker.' : '';
    setTimeout(tick, 250);
  }
  function setPhase(p) {
    if (p === phase) return;
    const now = performance.now() - t0;
    if (phase === 'download') T.download = now;
    if (phase === 'engine') T.engine = now;
    phase = p;
    $('bar').classList.toggle('busy', p !== 'download');
  }
  function fail(msg) {
    phase = 'error'; $('bar').style.display = 'none'; show('Could not start the game.');
    $('error').innerHTML = '';
    $('error').append(msg, document.createElement('br'));
    const b = document.createElement('button'); b.textContent = 'Reload'; b.onclick = () => location.reload(); $('error').append(b);
  }

  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail('This browser is missing: ' + missing.join(', ') + '. Please open the link in Chrome.'); return; }
  if (!Engine.isWebGLAvailable(2)) { fail('WebGL 2 graphics are turned off or not supported. Open in Chrome and make sure hardware acceleration is on.'); return; }

  tick();
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress(current, total) {
      const t = total || totalBytes;
      if (t > 0) { pct = Math.min(100, Math.floor(100 * current / t)); $('fill').style.width = pct + '%'; }
      // Switch to the moving "starting" bar just before the engine takes over the page (it paints before the long startup step).
      if (t > 0 && current >= t * 0.99) { setPhase('engine'); show('Starting engine…'); }
    },
    onPrint(...parts) {
      const line = parts.join(' ');
      console.log(line);
      // The engine's first print means the download finished and WebAssembly is running.
      if (line.startsWith('Godot Engine')) { pct = 100; $('fill').style.width = '100%'; setPhase('engine'); }
      if (line.startsWith('OpenGL API')) setPhase('cockpit');
    },
    onPrintError(...parts) { console.error(parts.join(' ')); },
  }).then(() => {
    // Hide the loading screen only once the game has actually drawn two frames.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      setPhase('cockpit'); T.ready = performance.now() - t0; phase = 'done';
      $('load').style.display = 'none'; $('rotate-phase').textContent = '';
      const d = T.download ?? T.ready, e = T.engine ?? d;
      const msg = `Loaded in ${sec(T.ready)} s · download ${sec(d)} · engine ${sec(e - d)} · cockpit ${sec(T.ready - e)}`;
      console.log('[load timing] ' + msg);
      window.__loadTiming = { total: T.ready, download: d, engine: e - d, cockpit: T.ready - e };
      const chip = $('timing'); chip.textContent = msg; chip.style.display = 'block';
      chip.onclick = () => chip.style.display = 'none';
      setTimeout(() => chip.style.display = 'none', 10000);
    }));
  }).catch((err) => fail((err && err.message ? err.message : String(err)) + ' — please reload in Chrome.'));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
})();
</script>
</body>
</html>
