<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc">
<meta name="hl-version" content="v1.5o">
<title>Homelancer Digital v1.5o</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#f6f9fc;color:#0e2f5a;font:16px system-ui,sans-serif;overflow:hidden;touch-action:none}
body{display:grid;place-items:center}
#canvas{position:fixed;inset:0;width:100vw;height:100vh;outline:none;touch-action:none;display:block}
#load,#rotate{position:fixed;inset:0;background:#f6f9fc;display:grid;place-content:center;text-align:center;padding:24px}
#load{z-index:5}
h1{letter-spacing:.2em;margin:0 0 6px;font-size:clamp(24px,6vw,40px)}
p{color:#3e8ed0;margin:6px 0}
#bar{width:min(420px,72vw);height:10px;margin:18px auto 8px;border:1px solid #1f5fa8;border-radius:6px;overflow:hidden;background:#cfe3f5}
#fill{height:100%;width:0;background:linear-gradient(90deg,#1f5fa8,#3e8ed0);transition:width .25s}
/* transform-only animation runs on the compositor, so it keeps moving while the engine blocks the main thread */
#bar.busy #fill{width:35%!important;transition:none;animation:busy 1.1s ease-in-out infinite alternate;will-change:transform}
@keyframes busy{from{transform:translateX(0)}to{transform:translateX(186%)}}
#phase{color:#0e2f5a;font-weight:600}
#hint{min-height:1.4em;font-size:14px}
#error{color:#b3261e;max-width:36em}
#error button{display:inline-block;margin-top:14px;border:1px solid #0e2f5a;background:#1f5fa8;color:#fff;border-radius:10px;padding:12px 18px;font-size:17px}
#rotate{display:none;z-index:10}
@media (orientation:portrait){#rotate{display:grid}}
#timing{position:fixed;left:50%;bottom:10px;translate:-50% 0;z-index:6;background:#071426e6;border:1px solid #2f7ea3;border-radius:8px;padding:6px 12px;font-size:13px;color:#9bbfd0;display:none;white-space:nowrap}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Homelancer Digital"></canvas>
<div id="load" role="status" aria-live="polite">
  <h1>HOMELANCER</h1>
  <p>Digital · v1.2 · Solara — Vega</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="phase">Loading Homelancer…</p>
  <p id="hint"></p>
  <p id="error"></p>
</div>
<div id="rotate"><h1>TURN YOUR PHONE</h1><p>Use landscape for both sticks and the flight controls.</p><p id="rotate-phase"></p></div>
<div id="timing"></div>
<script>window.__engineScriptFailed = false;</script>
<script src="$GODOT_URL" onerror="window.__engineScriptFailed = true"></script>
<script>
(function () {
  // Loading screen: real phases with timings (CORE download -> ENGINE start -> SYSTEM build -> READY), a watchdog
  // so a stall or crash becomes a visible message instead of an endless bar, and "Copy details" for bug reports.
  const $ = (id) => document.getElementById(id);
  const t0 = performance.now();
  const T = { download: null, engine: null, ready: null };
  const sec = (ms) => (ms / 1000).toFixed(1);
  let phase = 'download', pct = 0, lastProgress = performance.now(), lastLine = '', lastErr = '';
  const log = [];
  const STEPS = { download: 'CORE', engine: 'ENGINE', cockpit: 'SYSTEM', done: 'READY' };

  function show(text) { $('phase').textContent = text; $('rotate-phase').textContent = text; }
  function steps() {
    const order = ['download', 'engine', 'cockpit', 'done'];
    const i = order.indexOf(phase);
    return order.map((k, j) => (j < i ? '✓ ' : j === i ? '▸ ' : '· ') + STEPS[k]).join('   ');
  }
  function details() {
    return ['Homelancer load report', 'phase: ' + phase + ' at ' + sec(performance.now() - t0) + ' s',
      'download ' + pct + '%', 'last step: ' + lastLine, 'last error: ' + lastErr,
      'device: ' + navigator.userAgent, 'memory: ' + (navigator.deviceMemory || '?') + ' GB',
      'log:', ...log.slice(-25)].join('\n');
  }
  function addButtons(el) {
    const r = document.createElement('button'); r.textContent = 'Reload'; r.onclick = () => location.reload();
    const c = document.createElement('button'); c.textContent = 'Copy details'; c.style.marginLeft = '10px';
    c.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(details()); c.textContent = 'Copied'; };
    el.append(document.createElement('br'), r, c);
  }
  function warn(msg) {
    if ($('error').dataset.kind === 'warn' && $('error').dataset.msg === msg) return;
    $('error').dataset.kind = 'warn'; $('error').dataset.msg = msg;
    $('error').innerHTML = ''; $('error').append(msg); addButtons($('error'));
  }
  function clearWarn() { if ($('error').dataset.kind === 'warn') { $('error').innerHTML = ''; $('error').dataset.kind = ''; } }
  function fail(msg) {
    if (phase === 'done') return;
    phase = 'error'; $('bar').style.display = 'none'; show('Could not start the game.');
    $('error').dataset.kind = 'error'; $('error').innerHTML = ''; $('error').append(msg);
    if (lastErr) { const d = document.createElement('div'); d.style.cssText = 'font-size:12px;opacity:.8;margin-top:8px'; d.textContent = 'Engine said: ' + lastErr; $('error').append(d); }
    addButtons($('error'));
    window.__loadFailed = msg;
  }
  function tick() {
    if (phase === 'done' || phase === 'error') return;
    const el = performance.now() - t0;
    if (phase === 'download') show(`Downloading game core ${pct}% · ${sec(el)} s`);
    if (phase === 'engine') show('Starting engine…');
    if (phase === 'cockpit') show('Building star system…' + (lastLine ? ' (' + lastLine + ')' : ''));
    $('hint').textContent = steps();
    // watchdog: no download progress for 30 s, or engine/system start taking over 90 s
    if (phase === 'download' && performance.now() - lastProgress > 30000) warn('The download has stopped at ' + pct + '%. Your connection may have dropped. Reload to try again.');
    else if (phase !== 'download' && el - (T.download || 0) > 90000) warn('Starting is taking much longer than it should. Tap Copy details and send them, then Reload.');
    else clearWarn();
    setTimeout(tick, 250);
  }
  function setPhase(p) {
    if (p === phase || phase === 'error') return;
    const now = performance.now() - t0;
    if (phase === 'download') T.download = now;
    if (phase === 'engine') T.engine = now;
    phase = p;
    $('bar').classList.toggle('busy', p !== 'download');
  }
  window.addEventListener('error', (e) => { lastErr = String(e.message || e); log.push('error: ' + lastErr); });
  window.addEventListener('unhandledrejection', (e) => { lastErr = String(e.reason && e.reason.message || e.reason); log.push('rejection: ' + lastErr); });
  $('canvas').addEventListener('webglcontextlost', () => fail('The phone ran out of graphics memory (WebGL context lost). Close other tabs and apps, then Reload.'));

  if (window.__engineScriptFailed || typeof Engine === 'undefined') { fail('Could not download the game engine (index.js). Check your connection, then Reload.'); return; }
  const GODOT_CONFIG = $GODOT_CONFIG;
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail('This browser is missing: ' + missing.join(', ') + '. Please open the link in Chrome.'); return; }
  if (!Engine.isWebGLAvailable(2)) { fail('WebGL 2 graphics are turned off or not supported. Open in Chrome and make sure hardware acceleration is on.'); return; }
  const totalBytes = Object.values(GODOT_CONFIG.fileSizes || {}).reduce((a, b) => a + b, 0);

  tick();
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress(current, total) {
      const t = total || totalBytes;
      lastProgress = performance.now();
      if (t > 0) { pct = Math.min(100, Math.floor(100 * current / t)); $('fill').style.width = pct + '%'; }
      if (t > 0 && current >= t * 0.99) { setPhase('engine'); show('Starting engine…'); }
    },
    onPrint(...parts) {
      const line = parts.join(' ');
      console.log(line);
      log.push(line);
      if (line.startsWith('Godot Engine')) { pct = 100; $('fill').style.width = '100%'; setPhase('engine'); }
      if (line.startsWith('OpenGL API')) setPhase('cockpit');
      const m = line.match(/^\[profile\] ([^:]+)/);
      if (m) lastLine = m[1];
    },
    onPrintError(...parts) { const l = parts.join(' '); console.error(l); log.push('ERR ' + l); lastErr = l; },
  }).then(() => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (phase === 'error') return;
      setPhase('cockpit'); T.ready = performance.now() - t0; phase = 'done';
      $('load').style.display = 'none'; $('rotate-phase').textContent = '';
      const d = T.download ?? T.ready, e = T.engine ?? d;
      const msg = `Loaded in ${sec(T.ready)} s · download ${sec(d)} · engine ${sec(e - d)} · system ${sec(T.ready - e)}`;
      console.log('[load timing] ' + msg);
      window.__loadTiming = { total: T.ready, download: d, engine: e - d, cockpit: T.ready - e };
      const chip = $('timing'); chip.textContent = msg; chip.style.display = 'block';
      chip.onclick = () => chip.style.display = 'none';
      setTimeout(() => chip.style.display = 'none', 10000);
    }));
  }).catch((err) => fail((err && err.message ? err.message : String(err)) + ' — please reload in Chrome.'));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  // v1.5a FULL SCREEN: a phone browser (or the small browser inside another app) keeps its address bar and the
  // system buttons on screen. A page may only ask for full screen from a tap, so the first tap on the game asks,
  // and holds the phone in landscape. If the player leaves full screen on purpose, it is not forced back on them;
  // the next START (window.__hlFullscreen(), called by the game) asks again.
  let fsLeft = false;
  function goFull() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!rq) return;
    try {
      const p = rq.call(el, { navigationUI: 'hide' });
      const lock = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
      if (p && p.then) p.then(lock).catch(() => {}); else lock();
    } catch (e) {}
  }
  window.__hlFullscreen = () => { fsLeft = false; goFull(); };
  // v1.5j HOLD-TO-TALK: the browser's speech recognition (Chrome on Android, desktop Chrome / Edge). The game polls
  // window.__hlSR: state idle | listening | done | error; text = what was heard so far; err = why it stopped.
  window.__hlSR = { supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition), state: 'idle', text: '', err: '' };
  let hlRec = null;
  window.__hlListenStart = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const st = window.__hlSR;
    if (!SR) { st.state = 'error'; st.err = 'unsupported'; return false; }
    try { if (hlRec) hlRec.abort(); } catch (e) {}
    hlRec = new SR();
    hlRec.lang = navigator.language || 'en-US'; hlRec.interimResults = true; hlRec.continuous = true; hlRec.maxAlternatives = 1;
    st.state = 'listening'; st.text = ''; st.err = '';
    hlRec.onresult = (ev) => { let s = ''; for (let i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; st.text = s.trim(); };
    hlRec.onerror = (ev) => { st.err = ev.error || 'error'; if (ev.error !== 'no-speech' && ev.error !== 'aborted') st.state = 'error'; };
    hlRec.onend = () => { if (st.state !== 'error') st.state = 'done'; };
    try { hlRec.start(); } catch (e) { st.state = 'error'; st.err = String(e); return false; }
    return true;
  };
  window.__hlListenStop = () => { try { if (hlRec) hlRec.stop(); } catch (e) { window.__hlSR.state = 'done'; } };
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) fsLeft = true; });
  for (const ev of ['pointerup', 'touchend', 'click']) $('canvas').addEventListener(ev, () => { if (!fsLeft) goFull(); }, { passive: true });
})();
</script>
</body>
</html>
